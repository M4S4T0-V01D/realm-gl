name: Check and deploy the old WebGL address

# Realm WebGL is part of the Realm now (Settings → Rendering mode; github.com/M4S4T0-V01D/rarefriends-realm).
# This repository's site is the old address's compatibility entry point: redirect/ forwards every visit to the Realm
# with ?renderer=webgl (invitations and other parameters kept), and its preview pages to the Realm's.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/forward-browser.mjs
      - run: touch redirect/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
